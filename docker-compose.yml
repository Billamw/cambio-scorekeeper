services:
  cambio:
    build: .
    container_name: cambio-scorekeeper
    ports:
      - "8377:8000"   # LAN port -> container; change left side if 8377 is taken
    volumes:
      - ./data:/data  # all game data lives in this one folder (data.json + .bak files)
    environment:
      - CAMBIO_DATA=/data
    restart: unless-stopped
